name: IQonomy-ZeroTier-Final-Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "B9o6P2M0" /add
          net localgroup administrators runneradmin /add

      - name: Force Get Node ID (Portable Mode)
        id: zt_step
        shell: powershell
        run: |
          # تحميل ملفات التشغيل مباشرة بدون تثبيت MSI
          $url = "https://download.zerotier.com/dist/ZeroTier%20One.msi"
          $msiPath = "$($env:TEMP)\zt.msi"
          Invoke-WebRequest -Uri $url -OutFile $msiPath
          
          # استخراج الملفات يدوياً لتجنب مشاكل التثبيت
          mkdir "$($env:TEMP)\ZT"
          msiexec.exe /a $msiPath /qb TARGETDIR="$($env:TEMP)\ZT"
          
          # البحث عن الملف في المجلد المستخرج وتشغيله
          $ztExe = (Get-ChildItem -Path "$($env:TEMP)\ZT" -Filter "zerotier-one_x64.exe" -Recurse).FullName | Select-Object -First 1
          
          if ($ztExe) {
              Write-Host "ZeroTier binary extracted to: $ztExe"
              # تشغيل الخدمة في الخلفية لجلب الـ ID
              Start-Process $ztExe -ArgumentList "-p9993" -NoNewWindow
              Start-Sleep -Seconds 15
              
              # جلب الـ ID
              $status = & $ztExe -q status
              $myId = $status.Split(' ')[2]
              
              Write-Host "`n`n"
              Write-Host "**************************************************"
              Write-Host "FOUND IT! YOUR NODE ID IS: $myId"
              Write-Host "**************************************************"
              Write-Host "`n`n"
          } else {
              Write-Error "Failed to extract ZeroTier."
          }

      - name: Keep Alive
        run: Start-Sleep -Seconds 21600

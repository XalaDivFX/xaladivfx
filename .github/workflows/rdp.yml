name: XalaDivFX-Ngrok-Final

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        # تعيين كلمة المرور
        net user runneradmin "B9o6P2M0"

    - name: Download and Setup Ngrok
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # تحميل النسخة المستقرة
        Invoke-WebRequest https://bin.equinox.io/c/b34edq6tiW5/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .
        # التوثيق باستخدام التوكن الموضح في صورتك
        .\ngrok.exe config add-authtoken $env:NGROK_TOKEN

    - name: Start RDP Tunnel
      run: |
        # تشغيل التانل
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
        # انتظار 15 ثانية لضمان الربط
        Start-Sleep -Seconds 15

    - name: Get RDP Address
      run: |
        # جلب عنوان الاتصال من الـ API المحلي لـ Ngrok
        $response = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
        $url = $response.tunnels[0].public_url
        $clean_url = $url.Replace("tcp://", "")
        Write-Host "`n`n--------------------------------------------"
        Write-Host "Connect to: $clean_url"
        Write-Host "Username: runneradmin"
        Write-Host "Password: B9o6P2M0"
        Write-Host "--------------------------------------------`n`n"

    - name: Keep Alive
      run: |
        # إبقاء الأكشن يعمل (6 ساعات)
        Start-Sleep -Seconds 21600

name: IQonomy-Final-Direct

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "B9o6P2M0" /add
          net localgroup administrators runneradmin /add

      - name: Install Ngrok
        run: |
          curl -sO https://bin.equinox.io/c/b34ca1b2-c3d4-e5f6/ngrok-v3-stable-windows-amd64.zip
          expand-archive ngrok-v3-stable-windows-amd64.zip
          
      - name: Start Tunnel
        shell: powershell
        run: |
          # هنا هنستخدم أداة ngrok لأنها بتعطي الرابط مباشرة في الشاشة
          # سأضع لك الكود الذي يطبع العنوان بخط ضخم
          ./ngrok/ngrok.exe authtoken "ضع_هنا_توكن_نجروك_الخاص_بك"
          Start-Process ./ngrok/ngrok.exe -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 10
          $address = (Invoke-RestMethod http://localhost:4040/api/tunnels).tunnels.public_url
          Write-Host "**************************************************"
          Write-Host "CONNECT TO THIS ADDRESS: $address"
          Write-Host "**************************************************"

      - name: Keep Alive
        run: Start-Sleep -Seconds 21600

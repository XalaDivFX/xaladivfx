name: IQonomy-Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          if (!(net user | Select-String "runneradmin")) {
              net user runneradmin "B9o6P2M0" /add
              net localgroup administrators runneradmin /add
          }

      - name: Get_Node_ID
        shell: powershell
        run: |
          # تحميل البرنامج وتثبيته في مسار ثابت ومباشر
          $msiPath = "$($env:TEMP)\zt.msi"
          Invoke-WebRequest -Uri "https://download.zerotier.com/dist/ZeroTier%20One.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", $msiPath, "/qn" -Wait
          Start-Sleep -Seconds 20
          
          # استخراج الـ ID ووضعه في عنوان الخطوة القادمة
          $zt = "C:\Program Files (x86)\ZeroTier\One\zerotier-one_x64.exe"
          & $zt -q join 633e31d8a2e99f6f
          Start-Sleep -Seconds 5
          $id = (& $zt -q status).Split(' ')[2]
          
          # السطر التالي هو ما سيظهر لك الـ ID في الخارج بخط واضح
          echo "FINAL_ID=$id" >> $env:GITHUB_ENV

      - name: COPY_THIS_ID_==>_${{ env.FINAL_ID }}
        run: echo "Done"

      - name: Keep_Alive
        run: Start-Sleep -Seconds 21600

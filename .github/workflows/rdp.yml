name: IQonomy-RDP-Cloudflare-Easy

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    steps:
    - name: Enable Remote Desktop
      continue-on-error: true
      run: |
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 1 /f
        net user runneradmin "B9o6P2M0" /add
        net localgroup administrators runneradmin /add

    - name: Install Cloudflared
      run: |
        # Download cloudflared windows binary
        curl -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

  - name: Start Cloudflare Tunnel
      run: |
        # Force TCP on port 3389 with explicit protocol
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://127.0.0.1:3389" -NoNewWindow
        Start-Sleep -Seconds 30

    - name: Get RDP Address
      run: |
        # Cloudflare creates a random domain like: random-name.trycloudflare.com
        Write-Host "=========================================="
        Write-Host "LOOK ABOVE IN THE LOGS FOR THE LINK"
        Write-Host "It looks like: something.trycloudflare.com:3389"
        Write-Host "USERNAME: runneradmin"
        Write-Host "PASSWORD: B9o6P2M0"
        Write-Host "=========================================="

    - name: Keep Alive
      run: |
        Start-Sleep -Seconds 21600

name: IQonomy-RDP-Ngrok

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        net user runneradmin "B9o6P2M0"

    - name: Download and Setup Ngrok
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # تحميل الأداة
        Invoke-WebRequest https://bin.equinox.io/c/b34edq6tiW5/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        # فك الضغط في المجلد الحالي مباشرة (بدون مجلد فرعي)
        Expand-Archive ngrok.zip -DestinationPath .
        # تفعيل التوكن
        .\ngrok.exe config add-authtoken $env:NGROK_TOKEN

    - name: Start RDP Tunnel
      run: |
        # تشغيل الأداة من المسار الحالي مباشرة
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
        Start-Sleep -Seconds 15

    - name: Get RDP Address
      run: |
        $response = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
        $url = $response.tunnels[0].public_url
        $clean_url = $url.Replace("tcp://", "")
        Write-Host "--------------------------------------------"
        Write-Host "Connect via RDP to: $clean_url"
        Write-Host "User: runneradmin"
        Write-Host "Pass: B9o6P2M0"
        Write-Host "--------------------------------------------"

    - name: Wait for Connection
      run: |
        # إبقاء السيرفر متاحاً لمدة 6 ساعات
        Start-Sleep -Seconds 21600

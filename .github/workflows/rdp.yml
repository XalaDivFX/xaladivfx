name: RDP-Tunnel-Fixed
on:
  workflow_dispatch:
    inputs:
      zerotier_network:
        description: 'ZeroTier Network ID'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "B9o6P2M0" /add 2>$null
          net localgroup administrators runneradmin /add 2>$null
          net user runneradmin "B9o6P2M0"

      - name: Install ZeroTier & Join Network
        shell: powershell
        run: |
          # تحميل المثبّت الرسمي مباشرة
          Invoke-WebRequest "https://download.zerotier.com/dist/ZeroTier%20One.msi" -OutFile "zt.msi"
          Start-Process msiexec.exe -ArgumentList "/i zt.msi /qn" -Wait
          
          Start-Sleep -Seconds 15
          
          # جلب الـ Node ID
          $id = zerotier-cli info
          echo "### Node Info: $id" >> $env:GITHUB_STEP_SUMMARY
          
          # الانضمام للـ Network
          zerotier-cli join ${{ github.event.inputs.zerotier_network }}
          
          Start-Sleep -Seconds 20
          $ip = zerotier-cli listnetworks
          echo "### Network: $ip" >> $env:GITHUB_STEP_SUMMARY
          echo "### ✅ RDP Ready - Connect to ZeroTier IP" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep Alive
        run: Start-Sleep -Seconds 21600

name: IQonomy-ZeroTier-Final-Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $userExists = net user | Select-String "runneradmin"
          if (!$userExists) {
              net user runneradmin "B9o6P2M0" /add
              net localgroup administrators runneradmin /add
          }
          exit 0

      - name: Install ZeroTier
        shell: powershell
        run: |
          $msiPath = "$($env:TEMP)\ZeroTierOne.msi"
          Invoke-WebRequest -Uri "https://download.zerotier.com/dist/ZeroTier%20One.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", $msiPath, "/qn" -Wait
          # وقت إضافي لضمان تسجيل البرنامج في النظام
          Start-Sleep -Seconds 30

      - name: Join & Force Get ID
        shell: powershell
        run: |
          $networkId = "633e31d8a2e99f6f"
          
          # البحث الديناميكي عن مكان الملف التنفيذي
          $ztExe = (Get-ChildItem -Path "C:\Program Files*" -Filter "zerotier-one_x64.exe" -Recurse -ErrorAction SilentlyContinue).FullName | Select-Object -First 1
          
          if ($ztExe) {
              Write-Host "Found ZeroTier at: $ztExe"
              & $ztExe -q join $networkId
              Start-Sleep -Seconds 10
              $status = & $ztExe -q status
              $myId = $status.Split(' ')[2]
              
              Write-Host "**************************************************"
              Write-Host "SUCCESS! YOUR ID IS: $myId"
              Write-Host "**************************************************"
          } else {
              Write-Error "ZeroTier executable not found. Please check installation."
              exit 1
          }

      - name: Keep Alive
        run: Start-Sleep -Seconds 21600

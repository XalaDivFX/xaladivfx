name: IQonomy-RDP-Fixed-Final

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    steps:
    - name: Enable Remote Desktop
      run: |
        # تفعيل الـ RDP بطريقة سريعة ومباشرة
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 1 /f
        # تحديث كلمة المرور للمسؤول
        net user runneradmin "B9o6P2M0"

    - name: Download and Setup Ngrok
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # استخدام رابط تحميل مباشر ومستقر من Chocolatey أو الرابط الرسمي الحديث
        curl -L -o ngrok.zip https://bin.equinox.io/c/b34edq6tiW5/ngrok-v3-stable-windows-amd64.zip
        # ملاحظة: إذا فشل الرابط أعلاه، سنستخدم النسخة المباشرة:
        if (-not (Test-Path ngrok.zip)) {
           Invoke-WebRequest https://bin.equinox.io/c/b34edq6tiW5/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        }
        Expand-Archive ngrok.zip -DestinationPath .
        .\ngrok.exe config add-authtoken $env:NGROK_TOKEN

    - name: Start RDP Tunnel
      run: |
        # تشغيل التانل وتحديد المنطقة لتقليل البطء (Europe)
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp --region eu 3389" -NoNewWindow
        Start-Sleep -Seconds 15

    - name: Get RDP Address
      run: |
        $response = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
        $url = $response.tunnels[0].public_url
        $clean_url = $url.Replace("tcp://", "")
        Write-Host "`n`n--------------------------------------------"
        Write-Host "Connect to: $clean_url"
        Write-Host "User: runneradmin"
        Write-Host "Pass: B9o6P2M0"
        Write-Host "--------------------------------------------`n`n"

    - name: Keep Alive
      run: |
        # الانتظار لمدة 6 ساعات
        Start-Sleep -Seconds 21600

name: RDP-Tunnel-Fixed
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # حل مشكلة "account already exists"
          $userExists = net user runneradmin 2>$null
          if ($LASTEXITCODE -eq 0) {
            net user runneradmin "B9o6P2M0"
          } else {
            net user runneradmin "B9o6P2M0" /add
            net localgroup administrators runneradmin /add
          }
          echo "### ✅ RDP Enabled" >> $env:GITHUB_STEP_SUMMARY

      - name: Install ZeroTier
        shell: powershell
        run: |
          Invoke-WebRequest "https://download.zerotier.com/dist/ZeroTier%20One.msi" -OutFile "zt.msi"
          Start-Process msiexec.exe -ArgumentList "/i zt.msi /qn" -Wait
          Start-Sleep -Seconds 15

      - name: Join Network & Get Info
        shell: powershell
        run: |
          $ztCli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.exe"
          
          if (-not (Test-Path $ztCli)) {
            Write-Error "ZeroTier CLI not found!"
            Get-ChildItem "C:\Program Files (x86)\ZeroTier\" -Recurse
            exit 1
          }
          
          # Node Info
          $info = & $ztCli info
          echo "### 🔑 Node Info: $info" >> $env:GITHUB_STEP_SUMMARY
          
          # Join Network - hardcoded
          & $ztCli join 633e31d8a2e99f6f
          Start-Sleep -Seconds 25
          
          # Network Details
          $networks = & $ztCli listnetworks
          echo "### 🌐 Network: $networks" >> $env:GITHUB_STEP_SUMMARY
          
          $ip = ($networks -split '\s+') | Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+' } | Select-Object -First 1
          echo "### 💻 RDP IP: $ip" >> $env:GITHUB_STEP_SUMMARY
          echo "### 👤 User: runneradmin" >> $env:GITHUB_STEP_SUMMARY
          echo "### 🔐 Pass: B9o6P2M0" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600

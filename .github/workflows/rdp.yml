name: IQonomy-Final-Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Remote Desktop
        run: |
          # تجاوز خطأ "الحساب موجود" - لو موجود يكمل عادي
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $user = net user runneradmin 2>$null
          if ($LASTEXITCODE -ne 0) {
              net user runneradmin "B9o6P2M0" /add
              net localgroup administrators runneradmin /add
          } else {
              net user runneradmin "B9o6P2M0"
          }

      - name: Install and Get ID
        id: zt
        shell: powershell
        run: |
          # تثبيت مباشر وسريع
          $msiPath = "$($env:TEMP)\zt.msi"
          Invoke-WebRequest -Uri "https://download.zerotier.com/dist/ZeroTier%20One.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", $msiPath, "/qn" -Wait
          Start-Sleep -Seconds 20
          
          # جلب الـ ID غصباً عن المسارات
          $zt = "C:\Program Files (x86)\ZeroTier\One\zerotier-one_x64.exe"
          & $zt -q join 633e31d8a2e99f6f
          Start-Sleep -Seconds 5
          $id = (& $zt -q status).Split(' ')[2]
          
          # حفظ الـ ID في بيئة GitHub
          echo "MY_NODE_ID=$id" >> $env:GITHUB_ENV

      - name: YOUR_ID_IS_==>_${{ env.MY_NODE_ID }}
        run: echo "Look at the name of this step!"

      - name: Keep Alive
        run: Start-Sleep -Seconds 21600

name: IQonomy-RDP-PowerShell-Fixed

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    steps:
    - name: Enable Remote Desktop
      shell: powershell
      run: |
        # Enable RDP
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 1 /f
        
        # Create user if it doesn't exist using try-catch
        try {
            net user runneradmin "B9o6P2M0" /add
            net localgroup administrators runneradmin /add
        } catch {
            Write-Host "User already exists or error occurred, skipping..."
        }

    - name: Install Ngrok via Chocolatey
      run: |
        choco install ngrok -y

    - name: Authenticate Ngrok
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        ngrok config add-authtoken $env:NGROK_TOKEN

    - name: Start RDP Tunnel
      run: |
        Start-Process -FilePath "ngrok" -ArgumentList "tcp --region eu 3389" -NoNewWindow
        Start-Sleep -Seconds 20

    - name: Get RDP Address
      run: |
        $response = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
        $url = $response.tunnels[0].public_url
        $clean_url = $url.Replace("tcp://", "")
        Write-Host "=========================================="
        Write-Host "RDP ADDRESS : $clean_url"
        Write-Host "USERNAME    : runneradmin"
        Write-Host "PASSWORD    : B9o6P2M0"
        Write-Host "=========================================="

    - name: Keep Alive
      run: |
        Write-Host "Workflow is running. Connection is active."
        Start-Sleep -Seconds 21600

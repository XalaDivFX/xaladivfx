- name: Join Network and Get Info
        shell: powershell
        run: |
          # 1. تأمين جدار الحماية لضمان عدم قطع الـ RDP
          netsh advfirewall firewall add rule name="Allow RDP Port" dir=in action=allow protocol=TCP localport=3389
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # 2. تعريف مسار أداة ZeroTier
          $ztCli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat"
          
          # 3. جلب معلومات الـ Node
          $info = & $ztCli info
          $nodeId = ($info -split '\s+')[2]
          Add-Content $env:GITHUB_STEP_SUMMARY "### 🔑 Node ID: $nodeId"
          
          # 4. الانضمام للشبكة
          & $ztCli join 633e31d8a2e99f6f
          Write-Host "Waiting for network authorization and IP assignment..."
          Start-Sleep -Seconds 40 # زيادة وقت الانتظار لضمان سحب IP
          
          # 5. جلب الـ IP المخصص (Managed IP)
          $networks = & $ztCli listnetworks
          # البحث عن الـ IP اللي بيبدأ بـ 10. (المخصص من ZeroTier)
          $ip = ($networks -split '\s+') | Where-Object { $_ -match '^10\.' } | Select-Object -First 1
          
          # 6. طباعة البيانات النهائية في الـ Summary بشكل منظم وكبير
          Add-Content $env:GITHUB_STEP_SUMMARY "## 🖥️ RDP Connection Details"
          if ($ip) {
              Add-Content $env:GITHUB_STEP_SUMMARY "> **IP Address:** `$ip`"
          } else {
              Add-Content $env:GITHUB_STEP_SUMMARY "> **IP Address:** *Pending (Refresh ZeroTier Dashboard)*"
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "> **User:** `runneradmin`"
          Add-Content $env:GITHUB_STEP_SUMMARY "> **Pass:** `B9o6P2M0`"
          Add-Content $env:GITHUB_STEP_SUMMARY "---"
          Add-Content $env:GITHUB_STEP_SUMMARY "### 💡 Next Steps:"
          Add-Content $env:GITHUB_STEP_SUMMARY "1. Go to ZeroTier Central and **Auth** Node: `$nodeId`"
          Add-Content $env:GITHUB_STEP_SUMMARY "2. Once authorized, use the IP above in your RDP client."

      - name: Keep Alive
        shell: powershell
        run: |
          Write-Host "Connection is live. Keep this action running..."
          Start-Sleep -Seconds 21600

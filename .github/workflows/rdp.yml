name: IQonomy-Final-Success

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          if (!(net user | Select-String "runneradmin")) {
              net user runneradmin "B9o6P2M0" /add
              net localgroup administrators runneradmin /add
          }

      - name: Get_ID_Portable
        shell: powershell
        run: |
          # تحميل نسخة لا تحتاج تثبيت (Portable)
          $url = "https://download.zerotier.com/dist/ZeroTier%20One.msi"
          $msiPath = "$($env:TEMP)\zt.msi"
          Invoke-WebRequest -Uri $url -OutFile $msiPath
          
          # استخراج الملفات في مجلد جديد
          $target = "$($env:GITHUB_WORKSPACE)\ZT_EXE"
          mkdir $target
          msiexec.exe /a $msiPath /qb TARGETDIR=$target
          
          # تشغيل البرنامج مباشرة
          $zt = (Get-ChildItem -Path $target -Filter "zerotier-one_x64.exe" -Recurse).FullName | Select-Object -First 1
          Start-Process $zt -ArgumentList "-p9993" -NoNewWindow
          Start-Sleep -Seconds 15
          
          # جلب الـ ID
          $id = (& $zt -q status).Split(' ')[2]
          
          # إرسال الـ ID إلى ملخص الصفحة الرئيسية
          echo "### YOUR NODE ID IS: **$id**" >> $env:GITHUB_STEP_SUMMARY
          echo "FINAL_ID=$id" >> $env:GITHUB_ENV

      - name: ID_IS_==>_${{ env.FINAL_ID }}
        run: echo "Done"

      - name: Keep_Alive
        run: Start-Sleep -Seconds 21600

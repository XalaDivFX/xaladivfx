name: IQonomy-Zero-Error

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          if (!(net user | Select-String "runneradmin")) {
              net user runneradmin "B9o6P2M0" /add
              net localgroup administrators runneradmin /add
          }

      - name: Force_ID_Discovery
        shell: powershell
        run: |
          # 1. تحميل نسخة محمولة ومباشرة
          Invoke-WebRequest -Uri "https://download.zerotier.com/dist/ZeroTier%20One.msi" -OutFile "zt.msi"
          mkdir ZT_Core
          msiexec.exe /a zt.msi /qb TARGETDIR="$((Get-Item .).FullName)\ZT_Core"
          
          # 2. تشغيل الأداة من المجلد المستخرج مباشرة
          $zt = Get-ChildItem -Path ".\ZT_Core" -Filter "zerotier-one_x64.exe" -Recurse | Select-Object -ExpandProperty FullName
          Start-Process $zt -ArgumentList "-p9993" -NoNewWindow
          Start-Sleep -Seconds 15
          
          # 3. جلب الـ ID
          $id = (& $zt -q status).Split(' ')[2]
          
          # 4. وضعه في عنوان ضخم يظهر لك بالخارج
          echo "FINAL_ID=$id" >> $env:GITHUB_ENV
          echo "### SUCCESS! YOUR ID: **$id**" >> $env:GITHUB_STEP_SUMMARY

      - name: ==>_ID_IS:_[[_${{ env.FINAL_ID }}_]]
        run: echo "Look at the name above!"

      - name: Keep_Alive
        run: Start-Sleep -Seconds 21600

name: IQonomy-ZeroTier-Final-Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Remote Desktop
        shell: powershell
        run: |
          # تفعيل RDP وتجاوز خطأ اليوزر (حل مشكلة Screenshot 07-16-20)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          $userExists = net user | Select-String "runneradmin"
          if (!$userExists) {
              net user runneradmin "B9o6P2M0" /add
              net localgroup administrators runneradmin /add
          }
          exit 0

      - name: Install ZeroTier
        shell: powershell
        run: |
          $msiPath = "$($env:TEMP)\ZeroTierOne.msi"
          Invoke-WebRequest -Uri "https://download.zerotier.com/dist/ZeroTier%20One.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", $msiPath, "/qn" -Wait
          Start-Sleep -Seconds 20

      - name: Join ZeroTier Network
        shell: powershell
        run: |
          $networkId = "633e31d8a2e99f6f" 
          
          # فحص المسارات (حل مشكلة Screenshot 07-19-31)
          $paths = @(
              "C:\Program Files (x86)\ZeroTier\One\zerotier-one_x64.exe",
              "C:\Program Files\ZeroTier\One\zerotier-one_x64.exe"
          )
          
          $ztExe = ""
          foreach ($path in $paths) {
              if (Test-Path $path) { $ztExe = $path; break }
          }
          
          if ($ztExe) {
              & $ztExe -q join $networkId
              Start-Sleep -Seconds 5
              Write-Host "=========================================="
              Write-Host "YOUR NODE ID IS:"
              # إظهار الـ ID بوضوح للإضافة اليدوية
              & $ztExe -q status | ForEach-Object { $_.Split(' ')[2] }
              Write-Host "=========================================="
          }
          Start-Sleep -Seconds 10

      - name: Keep Alive
        run: Start-Sleep -Seconds 21600

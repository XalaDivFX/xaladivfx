name: IQonomy-ZeroTier-Final-Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Remote Desktop
        shell: powershell
        run: |
          # تفعيل RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # فحص وجود المستخدم قبل إنشائه لتجنب الـ Error 1
          $userExists = net user | Select-String "runneradmin"
          if (!$userExists) {
              net user runneradmin "B9o6P2M0" /add
              net localgroup administrators runneradmin /add
          } else {
              Write-Host "User runneradmin already exists, skipping creation."
          }
          # ضمان نجاح الخطوة مهما حدث
          exit 0

      - name: Install ZeroTier
        shell: powershell
        run: |
          $msiPath = "$($env:TEMP)\ZeroTierOne.msi"
          Invoke-WebRequest -Uri "https://download.zerotier.com/dist/ZeroTier%20One.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", $msiPath, "/qn" -Wait
          Start-Sleep -Seconds 20

      - name: Join ZeroTier Network
        shell: powershell
        run: |
          # استبدل YOUR_NETWORK_ID بالمعرف الخاص بك
          $networkId = "633e31d8a2e99f6f" 
          
          # محاولة تشغيل ملف ZeroTier من المسارات المحتملة
          $paths = @(
              "C:\Program Files (x86)\ZeroTier\One\zerotier-one_x64.exe",
              "C:\Program Files\ZeroTier\One\zerotier-one_x64.exe"
          )
          
          foreach ($path in $paths) {
              if (Test-Path $path) {
                  & $path -q join $networkId
                  Write-Host "Joined network via $path"
                  break
              }
          }
          Start-Sleep -Seconds 10

      - name: Keep Alive
        run: Start-Sleep -Seconds 21600

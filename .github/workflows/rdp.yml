name: RDP-Tunnel-Fixed
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $userExists = net user runneradmin 2>$null
          if ($LASTEXITCODE -eq 0) {
            net user runneradmin "B9o6P2M0"
          } else {
            net user runneradmin "B9o6P2M0" /add
            net localgroup administrators runneradmin /add
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "RDP Enabled"

      - name: Fix RDP Auth and Firewall
        shell: powershell
        run: |
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 0 /f
          
          # فتح البورت 3389 في الفايروول بشكل كامل
          netsh advfirewall firewall add rule name="RDP-TCP-3389" protocol=TCP dir=in localport=3389 action=allow
          netsh advfirewall firewall add rule name="RDP-UDP-3389" protocol=UDP dir=in localport=3389 action=allow
          
          # التأكد ان الـ RDP Service شغال
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService
          
          # تعطيل الـ Windows Firewall كليا عشان نضمن
          netsh advfirewall set allprofiles state off
          
          Add-Content $env:GITHUB_STEP_SUMMARY "Firewall and RDP Auth Fixed"

      - name: Install ZeroTier
        shell: powershell
        run: |
          Invoke-WebRequest "https://download.zerotier.com/dist/ZeroTier%20One.msi" -OutFile "zt.msi"
          Start-Process msiexec.exe -ArgumentList "/i zt.msi /qn" -Wait
          Start-Sleep -Seconds 15

      - name: Join Network and Get Info
        shell: powershell
        run: |
          $ztCli = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat"
          if (-not (Test-Path $ztCli)) {
            Write-Error "ZeroTier CLI not found!"
            exit 1
          }
          $info = & $ztCli info
          Write-Host "=== Node Info: $info ==="
          Add-Content $env:GITHUB_STEP_SUMMARY "Node Info: $info"
          & $ztCli join 633e31d8a2e99f6f
          Start-Sleep -Seconds 25
          $networks = & $ztCli listnetworks
          Write-Host "=== Networks: $networks ==="
          Add-Content $env:GITHUB_STEP_SUMMARY "Network: $networks"
          $ip = ($networks -split '\s+') | Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+' } | Select-Object -First 1
          Write-Host "=== RDP IP: $ip ==="
          Add-Content $env:GITHUB_STEP_SUMMARY "RDP IP: $ip"
          Add-Content $env:GITHUB_STEP_SUMMARY "User: runneradmin"
          Add-Content $env:GITHUB_STEP_SUMMARY "Pass: B9o6P2M0"

      - name: Keep Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600
